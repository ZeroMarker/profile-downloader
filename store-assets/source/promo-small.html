<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promo tile 440x280</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 440px; height: 280px; overflow: hidden; background: #080d16; }
  body { position: relative; }

  .scene {
    position: absolute; inset: 0;
    background: radial-gradient(85% 80% at 50% 45%, #1c2f49 0%, #0c1523 60%, #060a12 100%);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(125% 105% at 50% 48%, rgba(0,0,0,0) 52%, rgba(0,0,0,.58) 100%);
  }
  .glow {
    position: absolute; left: 50%; top: 47%;
    width: 420px; height: 420px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(72,198,232,.36), rgba(72,198,232,0) 64%);
    filter: blur(4px);
  }

  .streak {
    position: absolute; height: 2px; border-radius: 2px; z-index: 1;
    background: linear-gradient(90deg, rgba(72,198,232,0), rgba(72,198,232,.8) 55%, rgba(72,198,232,.25) 85%, rgba(72,198,232,0));
    box-shadow: 0 0 14px rgba(72,198,232,.5);
  }
  .streak.right { background: linear-gradient(270deg, rgba(72,198,232,0), rgba(72,198,232,.8) 55%, rgba(72,198,232,.25) 85%, rgba(72,198,232,0)); }
  .dot {
    position: absolute; width: 4px; height: 4px; border-radius: 50%; z-index: 1;
    background: rgba(120,220,245,.9); box-shadow: 0 0 10px rgba(72,198,232,.9);
  }

  .card {
    position: absolute; z-index: 2; border-radius: 12px; overflow: hidden;
    background: linear-gradient(155deg, #22344f, #152238);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 16px 30px rgba(0,0,0,.5);
  }
  .thumb { position: absolute; inset: 5px; border-radius: 8px; overflow: hidden; }
  .thumb.cyan { background: linear-gradient(155deg, #2f8fae, #48c6e8); }
  .thumb.pink { background: linear-gradient(155deg, #c4425f, #ff6b8a); }
  .thumb.deep { background: linear-gradient(155deg, #1c3550, #2a4c6d); }
  .sun { position: absolute; border-radius: 50%; background: #f4c95d; }
  .mtn {
    position: absolute; bottom: 0; background: #0e1a2b;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 0; height: 0;
    border-left: 13px solid rgba(248,251,255,.92);
    border-top: 8px solid transparent; border-bottom: 8px solid transparent;
  }
  .bar { position: absolute; border-radius: 2px; background: rgba(255,255,255,.20); }

  .icon {
    position: absolute; z-index: 5; left: 50%; top: 51%;
    width: 168px; height: 168px;
    transform: translate(-50%, -50%) rotate(-1.5deg);
    filter: drop-shadow(0 0 1px rgba(140,228,250,.55)) drop-shadow(0 16px 36px rgba(0,0,0,.62)) drop-shadow(0 0 34px rgba(72,198,232,.30));
  }
  .icon img { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="scene"></div>
  <div class="glow"></div>

  <div class="streak" style="left:-16px; top:101px; width:140px;"></div>
  <div class="streak" style="left:-24px; top:143px; width:120px;"></div>
  <div class="streak" style="left:-8px;  top:186px; width:96px;"></div>
  <div class="streak right" style="right:-16px; top:96px;  width:132px;"></div>
  <div class="streak right" style="right:-24px; top:142px; width:112px;"></div>
  <div class="streak right" style="right:-8px;  top:188px; width:88px;"></div>

  <div class="dot" style="left:64px;  top:88px;"></div>
  <div class="dot" style="left:26px;  top:172px;"></div>
  <div class="dot" style="right:52px; top:82px;"></div>
  <div class="dot" style="right:22px; top:176px;"></div>

  <div class="card" style="left:12px; top:76px;  width:84px; height:64px; transform: rotate(-10deg); opacity:.92">
    <div class="thumb cyan">
      <div class="sun" style="width:12px; height:12px; left:12px; top:10px;"></div>
      <div class="mtn" style="width:60px; height:30px; left:4px;"></div>
      <div class="mtn" style="width:44px; height:22px; right:4px;"></div>
    </div>
  </div>

  <div class="card" style="left:32px; top:166px; width:72px; height:54px; transform: rotate(-4deg); opacity:.9">
    <div class="thumb deep">
      <div class="bar" style="left:10px; top:12px; width:30px; height:5px;"></div>
      <div class="bar" style="left:10px; top:24px; width:44px; height:5px; opacity:.55;"></div>
      <div class="play" style="border-left-width:11px;"></div>
    </div>
  </div>

  <div class="card" style="right:14px; top:112px; width:86px; height:64px; transform: rotate(8deg); opacity:.92">
    <div class="thumb pink">
      <div class="sun" style="width:11px; height:11px; right:12px; top:10px; background:#ffe7c2;"></div>
      <div class="mtn" style="width:62px; height:32px; left:6px;"></div>
      <div class="mtn" style="width:40px; height:20px; right:6px;"></div>
    </div>
  </div>

  <div class="icon"><img src="../../extension/icons/icon.svg" alt=""></div>

  <div class="vignette"></div>
</body>
</html>
