<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promo marquee 1400x560</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1400px; height: 560px; overflow: hidden; background: #080d16; }
  body { position: relative; }

  .scene {
    position: absolute; inset: 0;
    background: radial-gradient(70% 95% at 24% 50%, #1b2f49 0%, #0c1523 55%, #070c14 100%);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(120% 110% at 32% 50%, rgba(0,0,0,0) 48%, rgba(0,0,0,.62) 100%);
  }
  .glow {
    position: absolute; left: 280px; top: 285px;
    width: 720px; height: 720px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(72,198,232,.26), rgba(72,198,232,0) 62%);
    filter: blur(6px);
  }
  .glow.right {
    left: 1120px; top: 280px; width: 700px; height: 620px;
    background: radial-gradient(circle, rgba(72,198,232,.12), rgba(72,198,232,0) 65%);
  }

  .streak {
    position: absolute; height: 2px; border-radius: 2px; z-index: 1;
    background: linear-gradient(90deg, rgba(72,198,232,0), rgba(72,198,232,.85) 32%, rgba(72,198,232,0));
    box-shadow: 0 0 16px rgba(72,198,232,.45);
  }
  .dot {
    position: absolute; width: 5px; height: 5px; border-radius: 50%; z-index: 1;
    background: rgba(130,225,248,.95); box-shadow: 0 0 12px rgba(72,198,232,.9);
  }

  .card {
    position: absolute; border-radius: 16px; overflow: hidden;
    background: linear-gradient(155deg, #22344f, #152238);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 22px 40px rgba(0,0,0,.5);
  }
  .thumb { position: absolute; inset: 6px; border-radius: 11px; overflow: hidden; }
  .thumb.cyan { background: linear-gradient(155deg, #2f8fae, #48c6e8); }
  .thumb.pink { background: linear-gradient(155deg, #c4425f, #ff6b8a); }
  .thumb.deep { background: linear-gradient(155deg, #1c3550, #2a4c6d); }
  .sun { position: absolute; border-radius: 50%; background: #f4c95d; }
  .mtn {
    position: absolute; bottom: 0; background: #0e1a2b;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 0; height: 0;
    border-left: 20px solid rgba(248,251,255,.94);
    border-top: 12px solid transparent; border-bottom: 12px solid transparent;
  }
  .bar { position: absolute; border-radius: 3px; background: rgba(255,255,255,.20); }

  .window {
    position: absolute; border-radius: 20px; overflow: hidden;
    background: linear-gradient(165deg, #142138, #0e1829);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 34px 70px rgba(0,0,0,.55);
  }
  .win-head {
    position: absolute; left: 0; top: 0; right: 0; height: 54px;
    background: rgba(255,255,255,.035);
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .win-dot { position: absolute; top: 23px; width: 10px; height: 10px; border-radius: 50%; }

  .tile { position: absolute; border-radius: 12px; overflow: hidden; background: #101c2e; }
  .tile .thumb { inset: 0; border-radius: 12px; }

  .icon {
    position: absolute; z-index: 5; left: 118px; top: 112px;
    width: 322px; height: 322px;
    transform: rotate(-2deg);
    filter: drop-shadow(0 0 2px rgba(140,228,250,.5)) drop-shadow(0 28px 58px rgba(0,0,0,.65)) drop-shadow(0 0 60px rgba(72,198,232,.28));
  }
  .icon img { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="scene"></div>
  <div class="glow"></div>
  <div class="glow right"></div>

  <div class="streak" style="left:430px; top:196px; width:330px;"></div>
  <div class="streak" style="left:452px; top:246px; width:260px;"></div>
  <div class="streak" style="left:430px; top:316px; width:300px;"></div>
  <div class="streak" style="left:470px; top:372px; width:230px;"></div>
  <div class="streak" style="left:600px; top:430px; width:190px;"></div>

  <div class="dot" style="left:742px; top:188px;"></div>
  <div class="dot" style="left:700px; top:242px;"></div>
  <div class="dot" style="left:726px; top:366px;"></div>
  <div class="dot" style="left:652px; top:424px;"></div>

  <!-- background window -->
  <div class="window" style="left:1046px; top:64px; width:330px; height:330px; transform: rotate(2.4deg); opacity:.62; z-index:1;">
    <div class="win-head"></div>
    <div class="win-dot" style="left:22px; background:#ff6b8a; opacity:.8;"></div>

    <div class="win-dot" style="left:24px; background:#ff6b8a;"></div>
    <div class="win-dot" style="left:46px; background:#f4c95d;"></div>
    <div class="win-dot" style="left:68px; background:#48c6e8;"></div>
    <div class="bar" style="left:104px; top:23px; width:130px; height:9px; opacity:.5;"></div>
    <div class="bar" style="left:250px; top:23px; width:74px; height:9px; opacity:.28;"></div>

    <div class="tile" style="left:22px; top:76px; width:168px; height:150px;">
      <div class="thumb cyan">

    </div>
    <div class="tile" style="left:200px; top:76px; width:168px; height:150px;">

    </div>

    <div class="tile" style="left:22px; top:240px; width:168px; height:150px;">
      <div class="thumb deep">
        <div class="bar" style="left:18px; top:22px; width:88px; height:9px;"></div>
        <div class="bar" style="left:18px; top:42px; width:120px; height:9px; opacity:.5;"></div>
        <div class="bar" style="left:18px; top:62px; width:64px; height:9px; opacity:.3;"></div>
      </div>
    </div>
    <div class="tile" style="left:200px; top:240px; width:168px; height:150px;">
      <div class="thumb cyan">
        <div class="sun" style="width:20px; height:20px; left:20px; top:18px;"></div>
        <div class="mtn" style="width:110px; height:60px; right:8px;"></div>
      </div>
    </div>
    <div class="tile" style="left:378px; top:240px; width:168px; height:150px;">
      <div class="thumb pink">
        <div class="sun" style="width:20px; height:20px; right:20px; top:18px; background:#ffe7c2;"></div>
        <div class="mtn" style="width:132px; height:74px; left:16px;"></div>
      </div>
    </div>
  </div>

  <!-- floating media being pulled toward the icon -->
  <div class="card" style="left:468px; top:120px; width:132px; height:100px; transform: rotate(-9deg); z-index:3;">
    <div class="thumb cyan">
      <div class="sun" style="width:16px; height:16px; left:14px; top:12px;"></div>
      <div class="mtn" style="width:88px; height:48px; left:6px;"></div>
    </div>
  </div>

  <div class="card" style="left:600px; top:170px; width:120px; height:92px; transform: rotate(-4deg); z-index:3;">
    <div class="thumb pink">
      <div class="sun" style="width:14px; height:14px; right:14px; top:12px; background:#ffe7c2;"></div>
      <div class="mtn" style="width:82px; height:46px; left:8px;"></div>
    </div>
  </div>

  <div class="card" style="left:502px; top:322px; width:126px; height:96px; transform: rotate(6deg); z-index:3;">
    <div class="thumb deep">
      <div class="play" style="border-left-width:17px; border-top-width:10px; border-bottom-width:10px;"></div>
      <div class="bar" style="left:14px; bottom:12px; width:56px; height:6px;"></div>
    </div>
  </div>

  <div class="card" style="left:646px; top:388px; width:104px; height:80px; transform: rotate(-7deg); z-index:3;">

      <div class="sun" style="width:13px; height:13px; left:12px; top:10px;"></div>
      <div class="mtn" style="width:70px; height:38px; right:6px;"></div>
    </div>
  </div>

  <div class="icon"><img src="../../extension/icons/icon.svg" alt=""></div>

  <div class="vignette"></div>
</body>
</html>
