<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Media Downloader</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1><span aria-hidden="true">📥</span> <span data-i18n="appTitle"></span></h1>
      <p class="subtitle" data-i18n="subtitle"></p>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Status / Platform Detection -->
      <div id="status-section" class="section">
        <div id="platform-indicator" class="platform-badge">
          <span id="platform-icon">🔍</span>
          <span id="platform-text" data-i18n="detectingPlatform"></span>
        </div>
      </div>

      <!-- Profile Info -->
      <div id="profile-section" class="section hidden">
        <div class="profile-card">
          <img id="profile-avatar" class="avatar" src="" alt="avatar" data-i18n-alt="avatarAlt" />
          <div class="profile-info">
            <h3 id="profile-username">@username</h3>
            <p id="profile-display-name" class="display-name"></p>
            <p id="profile-stats" class="stats"></p>
          </div>
        </div>
      </div>

      <!-- Media List -->
      <div id="media-section" class="section hidden">
        <div class="media-header">
          <h2 data-i18n="mediaHeading"></h2>
          <span id="media-count" class="count-badge">0 items</span>
        </div>
        <div class="media-actions">
          <button id="select-all-btn" class="btn btn-sm" data-i18n="selectAll"></button>
          <button id="download-selected-btn" class="btn btn-primary btn-sm" disabled>
            Download Selected (0)
          </button>
          <button id="download-all-btn" class="btn btn-secondary btn-sm" data-i18n="downloadAll"></button>
        </div>
        <div id="media-list" class="media-grid">
          <!-- Media items rendered by JS -->
          <div class="loading" data-i18n="loadingMedia"></div>
        </div>
      </div>

      <!-- Download Progress -->
      <div id="progress-section" class="section hidden">
        <h3 data-i18n="downloadsHeading"></h3>
        <div id="progress-bar" class="progress-bar">
          <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
        </div>
        <p id="progress-text" class="progress-text" data-i18n="progressInitial"></p>
      </div>

      <!-- Error Display -->
      <div id="error-section" class="section hidden">
        <div class="error-card">
          <span class="error-icon">⚠️</span>
          <p id="error-text" data-i18n="errorOccurred"></p>
          <button id="retry-btn" class="btn btn-sm" data-i18n="retry"></button>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>
        <a href="https://github.com/ZeroMarker/profile-downloader" target="_blank">
          v1.0.0
        </a>
      </p>
    </footer>
  </div>

  <!-- WASM and App Scripts -->
  <script src="popup.js" type="module"></script>
</body>
</html>
