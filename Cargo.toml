[package]
name = "profile-downloader-core"
version = "0.1.0"
edition = "2021"
description = "Core WASM library for X/TikTok/Instagram profile media downloader Chrome extension"
authors = ["Mark Chen"]
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlDocument",
    "HtmlElement",
    "Node",
    "Window",
    "HtmlAnchorElement",
    "Url",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "Blob",
    "Url",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
